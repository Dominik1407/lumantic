<title>Lumantic Uhrwerk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans+Condensed:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a time machine with three skins. The overview is a dial whose rim is history; the selected moment sits under a fixed pointer.
   Opening a theme unfolds its stars into a full dashboard that Lumina has pre-built from the data. */
:root {
  --bg: #05070f; --bg-2: #0b1122; --surface: rgba(12, 17, 34, .74); --surface-2: rgba(255, 255, 255, .03);
  --ink: #eee8d9; --ink-2: #b4ae9f; --dim: #7d7a71;
  --line: rgba(238, 232, 217, .11); --line-2: rgba(238, 232, 217, .24);
  --accent: #d6b06a; --alert: #ff6b4d; --watch: #f3b746; --good: #63d39f;
  --c1: #d6b06a; --c2: #6f9fd6; --c3: #c58bd0;
  --halo: 1; --mark: 1; --radius: 0px; --blur: 10px; --shadow: none; --dash: none;
  --f-display: "Cormorant Garamond", Georgia, serif; --f-voice: "Cormorant Garamond", Georgia, serif;
  --f-ui: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; --f-data: "Geist Mono", ui-monospace, Consolas, monospace;
  --voice-style: italic; --voice-size: 1.15; --display-weight: 600; --label-case: uppercase;
  --page: radial-gradient(ellipse 70% 55% at 30% 0%, color-mix(in srgb, #d6b06a 7%, #0b1122) 0%, transparent 70%);
  --accent-soft: color-mix(in srgb, var(--accent) 15%, transparent);
  color-scheme: dark;
}
:root[data-design="zifferblatt"] {
  --bg: #eceef1; --bg-2: #ffffff; --surface: #ffffff; --surface-2: #f5f6f8;
  --ink: #15223d; --ink-2: #4b5772; --dim: #8892a6;
  --line: rgba(21, 34, 61, .1); --line-2: rgba(21, 34, 61, .2);
  --accent: #2348b5; --alert: #c63f2b; --watch: #b07a0a; --good: #1c7c52;
  --c1: #2348b5; --c2: #7b8db8; --c3: #c9a24a;
  --halo: 0; --mark: 0; --radius: 14px; --blur: 0px; --shadow: 0 1px 2px rgba(21, 34, 61, .05), 0 10px 30px rgba(21, 34, 61, .07); --dash: none;
  --f-display: "Manrope", system-ui, sans-serif; --f-voice: "Newsreader", Georgia, serif;
  --f-ui: "Manrope", system-ui, sans-serif; --f-data: "IBM Plex Mono", ui-monospace, monospace;
  --voice-style: italic; --voice-size: 1.05; --display-weight: 700; --label-case: uppercase;
  --page: radial-gradient(ellipse 60% 50% at 70% 0%, #ffffff 0%, transparent 70%);
  color-scheme: light;
}
:root[data-design="messtisch"] {
  --bg: #0b1f36; --bg-2: #0f2744; --surface: rgba(13, 36, 63, .86); --surface-2: rgba(127, 211, 247, .04);
  --ink: #e4f0f9; --ink-2: #9dbfd7; --dim: #6889a4;
  --line: rgba(150, 205, 240, .16); --line-2: rgba(150, 205, 240, .34);
  --accent: #7fd3f7; --alert: #ff7a59; --watch: #f2c14e; --good: #6fe3b0;
  --c1: #7fd3f7; --c2: #f2c14e; --c3: #c6a6ff;
  --halo: .35; --mark: 1; --radius: 2px; --blur: 0px; --shadow: none; --dash: 4 3;
  --f-display: "IBM Plex Sans Condensed", system-ui, sans-serif; --f-voice: "IBM Plex Sans Condensed", system-ui, sans-serif;
  --f-ui: "IBM Plex Sans Condensed", system-ui, sans-serif; --f-data: "IBM Plex Mono", ui-monospace, monospace;
  --voice-style: italic; --voice-size: 1; --display-weight: 600; --label-case: uppercase;
  --page: linear-gradient(rgba(127, 211, 247, .06) 1px, transparent 1px) 0 0 / 24px 24px, linear-gradient(90deg, rgba(127, 211, 247, .06) 1px, transparent 1px) 0 0 / 24px 24px,
    linear-gradient(rgba(127, 211, 247, .1) 1px, transparent 1px) 0 0 / 120px 120px, linear-gradient(90deg, rgba(127, 211, 247, .1) 1px, transparent 1px) 0 0 / 120px 120px;
  color-scheme: dark;
}
html { background: var(--bg); }
body { min-height: 100%; color: var(--ink); background: var(--page), var(--bg); background-attachment: fixed; font: 400 14px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; transition: background-color .5s, color .5s; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
.label { font: 500 10px/1.3 var(--f-data); letter-spacing: .15em; text-transform: var(--label-case); color: var(--dim); }
.voice { font-family: var(--f-voice); font-style: var(--voice-style); }
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; gap: 12px 24px; flex-wrap: wrap; padding-block: 12px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: blur(12px); }
.brand { display: flex; align-items: baseline; gap: 10px; }
.mark { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); align-self: center; box-shadow: 0 0 0 4px var(--accent-soft), 0 0 18px 4px color-mix(in srgb, var(--accent) calc(var(--halo) * 30%), transparent); }
.word { font: 600 18px/1 var(--f-ui); letter-spacing: -.01em; }
.slogan { font: var(--voice-style) 500 calc(15px * var(--voice-size))/1 var(--f-voice); color: var(--ink-2); }
.crumbs { display: flex; align-items: center; gap: 6px; font: 500 11px/1 var(--f-data); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.crumbs button { border: 0; background: none; padding: 4px 0; color: var(--ink-2); }
.crumbs button:hover { color: var(--accent); }
.crumbs b { font-weight: 500; color: var(--ink); }
.designs { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.design-btn { border: 1px solid transparent; background: none; padding: 7px 10px; border-radius: var(--radius); font: 500 10.5px/1 var(--f-data); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); display: inline-flex; gap: 7px; align-items: center; }
.design-btn i { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--line-2); }
.design-btn[aria-pressed="true"] { color: var(--ink); border-color: var(--line-2); background: var(--accent-soft); }

/* Shared surfaces */
.panel { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); backdrop-filter: blur(var(--blur)); }
.reg { position: absolute; width: 10px; height: 10px; border: 0 solid var(--accent); pointer-events: none; opacity: calc(var(--mark) * .8); }
.reg.tl { top: -1px; left: -1px; border-top-width: 1px; border-left-width: 1px; }
.reg.tr { top: -1px; right: -1px; border-top-width: 1px; border-right-width: 1px; }
.reg.bl { bottom: -1px; left: -1px; border-bottom-width: 1px; border-left-width: 1px; }
.reg.br { bottom: -1px; right: -1px; border-bottom-width: 1px; border-right-width: 1px; }
.pill { display: inline-flex; align-items: center; gap: 7px; font: 500 9.5px/1 var(--f-data); letter-spacing: .12em; text-transform: uppercase; padding: 5px 8px 5px 7px; border: 1px solid var(--line-2); border-radius: calc(var(--radius) * 4); white-space: nowrap; color: var(--ink); }
.pill i, .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); display: inline-block; flex: none; }
[data-level="alert"] > i, .dot[data-level="alert"] { background: var(--alert); box-shadow: 0 0 calc(var(--halo) * 9px) var(--alert); }
[data-level="watch"] > i, .dot[data-level="watch"] { background: var(--watch); box-shadow: 0 0 calc(var(--halo) * 8px) var(--watch); }
[data-level="good"] > i, .dot[data-level="good"] { background: var(--good); }
[data-level="info"] > i, .dot[data-level="info"] { background: var(--accent); }
.pill[data-level="alert"] { border-color: color-mix(in srgb, var(--alert) 50%, transparent); }
.pill[data-level="watch"] { border-color: color-mix(in srgb, var(--watch) 50%, transparent); }
.btn { border: 1px solid var(--line-2); background: none; border-radius: var(--radius); padding: 8px 12px; font: 500 10.5px/1 var(--f-data); letter-spacing: .13em; text-transform: uppercase; color: var(--ink-2); transition: color .2s, border-color .2s, background .2s; }
.btn:hover { color: var(--ink); border-color: var(--ink-2); }
.btn--accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
.btn--accent:hover, .btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--radius); overflow: hidden; }
.seg button { border: 0; background: none; padding: 7px 11px; font: 500 10px/1 var(--f-data); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); }

/* Overview */
.view { animation: view-in .7s cubic-bezier(.2, .8, .2, 1); }
@keyframes view-in { from { opacity: .35; transform: scale(.985); } }
.ov { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); gap: 22px; padding-block: 18px 40px; align-items: start; }
.stage { position: relative; width: 100%; max-width: min(860px, calc(100vh - 110px)); aspect-ratio: 1; margin: 0 auto; touch-action: none; container-type: inline-size; }
.stage svg { width: 100%; height: 100%; display: block; overflow: visible; }
.hub { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 6px; text-align: center; pointer-events: none; }
.hub > * { pointer-events: auto; }
.hub-month { font: 400 clamp(11px, 3.3cqw, 28px)/1 var(--f-data); letter-spacing: -.02em; }
.hub-sub { font: var(--voice-style) 500 calc(clamp(9px, 1.7cqw, 14px) * var(--voice-size))/1.2 var(--f-voice); color: var(--ink-2); }
.hub-ctrl { display: flex; gap: 6px; margin-top: 4px; }
.hub-ctrl button { width: clamp(24px, 4.2cqw, 34px); height: clamp(24px, 4.2cqw, 34px); border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface); color: var(--accent); font: 500 11px/1 var(--f-data); display: grid; place-items: center; }
.hub-ctrl button:hover { border-color: var(--accent); }
.hub-ctrl button[aria-pressed="true"] { background: var(--accent-soft); }
.flash { position: absolute; left: 50%; top: 3.5%; transform: translateX(-50%); text-align: center; pointer-events: none; animation: flash 2.6s ease-out forwards; white-space: nowrap; }
.flash b { display: block; font: var(--voice-style) 500 calc(19px * var(--voice-size))/1.2 var(--f-voice); color: var(--ink); }
.flash span { font: 500 10px/1 var(--f-data); letter-spacing: .15em; text-transform: uppercase; color: var(--accent); }
@keyframes flash { 0% { opacity: 0; transform: translate(-50%, 8px); } 12% { opacity: 1; transform: translate(-50%, 0); } 75% { opacity: 1; } 100% { opacity: 0; } }
.side { display: grid; gap: 14px; }
.side .panel { padding: 16px 18px; display: grid; gap: 12px; }
.brief { margin: 0; font: var(--voice-style) 500 calc(22px * var(--voice-size))/1.2 var(--f-voice); text-wrap: balance; }
.brief .name { border: 0; background: none; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; text-underline-offset: 4px; text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.brief .name--alert { color: var(--alert); text-decoration-color: color-mix(in srgb, var(--alert) 40%, transparent); }
.sig { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; border: 0; border-top: 1px solid var(--line); background: none; padding: 10px 0 2px; text-align: left; }
.sig:first-of-type { border-top: 0; padding-top: 0; }
.sig b { font: var(--display-weight) 15px/1.2 var(--f-ui); }
.sig .num { font-size: 13px; }
.sig small { grid-column: 2 / -1; font: var(--voice-style) 500 calc(14px * var(--voice-size))/1.25 var(--f-voice); color: var(--ink-2); }
.sig:hover b { color: var(--accent); }
.dashes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dash-link { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); padding: 10px 11px; text-align: left; display: grid; gap: 6px; transition: border-color .2s, transform .2s; }
.dash-link:hover { border-color: var(--accent); transform: translateY(-1px); }
.dash-link b { font: var(--display-weight) 14px/1.1 var(--f-ui); }
.dash-link .dots { display: flex; gap: 3px; min-height: 6px; }
.dash-link--all { grid-column: 1 / -1; background: var(--accent-soft); }

/* Dial (SVG classes read the design tokens) */
.d-line { stroke: var(--ink); }
.d-year { fill: var(--ink); fill-opacity: .035; stroke: var(--line-2); stroke-width: 1; cursor: pointer; transition: fill-opacity .3s; }
.d-year:hover { fill-opacity: .09; }
.d-year.is-now { fill: var(--accent); fill-opacity: .16; stroke: var(--accent); }
.d-txt { font-family: var(--f-data); fill: var(--ink-2); }
.d-month { font-family: var(--f-data); fill: var(--ink); }
.d-pointer { fill: var(--accent); stroke: var(--accent); }
.d-event { fill: var(--bg); stroke: var(--accent); stroke-width: 1.4; cursor: pointer; }
.d-ring { fill: none; stroke: var(--line-2); stroke-dasharray: var(--dash); }
.d-cluster { font-family: var(--f-voice); font-style: var(--voice-style); fill: var(--ink-2); cursor: pointer; transition: fill .2s; }
.d-cluster:hover { fill: var(--accent); }
.d-con { stroke: var(--ink); stroke-opacity: .16; fill: none; stroke-dasharray: var(--dash); }
.st { cursor: pointer; }
.st .halo { opacity: var(--halo); }
.st .core { fill: var(--ink); }
:root[data-design="zifferblatt"] .st .core { filter: drop-shadow(0 1px 2px rgba(21, 34, 61, .35)); }
.st .track { fill: none; stroke: var(--ink); stroke-opacity: .12; }
.st .lab { font-family: var(--f-data); fill: var(--ink-2); }
.st .val { font-family: var(--f-data); fill: var(--ink); }
.st:hover .lab { fill: var(--ink); }
.trail { fill: none; stroke-linecap: round; }
.cross { stroke: var(--accent); stroke-width: 1; opacity: 0; }
:root[data-design="messtisch"] .cross { opacity: .8; }
:root[data-design="messtisch"] .st .core { fill: none; stroke: var(--ink); stroke-width: 1.4; }

/* Dashboard */
.dash { padding-block: 18px 80px; display: grid; gap: 16px; }
.dash-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; }
.dash-title { margin: 0; font: var(--display-weight) clamp(30px, 4vw, 46px)/1 var(--f-display); letter-spacing: -.015em; }
:root:not([data-design]) .dash-title, :root[data-design="atlas"] .dash-title { font-style: italic; font-weight: 500; }
.dash-sub { margin: 8px 0 0; font: var(--voice-style) 500 calc(19px * var(--voice-size))/1.3 var(--f-voice); color: var(--ink-2); max-width: 60ch; }
.dash-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.strip { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; padding: 12px 16px; }
.strip-play { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line-2); background: none; color: var(--accent); font: 500 10px/1 var(--f-data); }
.strip-play[aria-pressed="true"] { background: var(--accent-soft); }
.strip-track { position: relative; height: 44px; touch-action: none; cursor: ew-resize; }
.strip-track svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.strip-handle { position: absolute; top: -2px; bottom: 0; width: 2px; background: var(--accent); transform: translateX(-1px); box-shadow: 0 0 calc(var(--halo) * 12px) var(--accent); pointer-events: none; }
.strip-handle span { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font: 500 10px/1 var(--f-data); letter-spacing: .06em; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radius); padding: 3px 6px; white-space: nowrap; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.tile { padding: 14px 16px 12px; display: grid; gap: 8px; text-align: left; transition: border-color .4s, box-shadow .4s; }
.tile[data-level="alert"] { border-color: color-mix(in srgb, var(--alert) 40%, transparent); box-shadow: var(--shadow), 0 0 calc(var(--halo) * 40px) calc(var(--halo) * -12px) var(--alert); }
.tile[data-level="watch"] { border-color: color-mix(in srgb, var(--watch) 35%, transparent); }
.tile.is-focus { outline: 1px solid var(--accent); outline-offset: 3px; }
.tile-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tile-name { font: var(--display-weight) 15px/1.2 var(--f-ui); }
.tile-val { font: 400 30px/1 var(--f-data); letter-spacing: -.04em; white-space: nowrap; }
.tile-val small { font-size: 10px; letter-spacing: .1em; color: var(--ink-2); margin-left: 5px; }
.tile-delta { font: 400 10.5px/1.2 var(--f-data); color: var(--ink-2); }
.tile svg { width: 100%; height: 30px; display: block; overflow: visible; }
.note { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.note p { margin: 0; font: var(--voice-style) 500 calc(18px * var(--voice-size))/1.3 var(--f-voice); color: var(--ink); }
.charts { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; grid-auto-flow: dense; align-items: start; }
.chart-card { grid-column: span 6; padding: 16px 18px 14px; display: grid; gap: 10px; min-width: 0; align-content: start; }
.chart-card.size-L { grid-column: span 8; } .chart-card.size-S { grid-column: span 4; } .chart-card.size-XL { grid-column: span 12; }
.chart-card.enter { animation: condense .7s cubic-bezier(.2, .8, .2, 1) backwards; }
@keyframes condense { from { opacity: .25; transform: translateY(12px) scale(.985); } }
.chart-card.is-dragging { opacity: .3; }
.cc-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.cc-title { margin: 0; font: var(--display-weight) 17px/1.2 var(--f-ui); }
.cc-why { margin: 3px 0 0; font: var(--voice-style) 500 calc(15px * var(--voice-size))/1.3 var(--f-voice); color: var(--ink-2); }
.cc-tools { display: none; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.is-edit .cc-tools { display: flex; }
.cc-tools button { border: 1px solid var(--line); background: none; border-radius: var(--radius); color: var(--ink-2); font: 500 9.5px/1 var(--f-data); letter-spacing: .08em; padding: 5px 7px; text-transform: uppercase; }
.cc-tools button[aria-pressed="true"], .cc-tools button:hover { color: var(--ink); border-color: var(--accent); }
.is-edit .chart-card { cursor: grab; }
.is-edit .chart-card::after { content: ""; position: absolute; inset: 4px; border: 1px dashed var(--line-2); border-radius: var(--radius); pointer-events: none; }
.plot { position: relative; height: 200px; }
.size-S .plot { height: 160px; }
.size-XL .plot, .size-L .plot { height: 230px; }
.plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.plot-lab { position: absolute; font: 500 9.5px/1 var(--f-data); letter-spacing: .06em; color: var(--dim); white-space: nowrap; pointer-events: none; }
.plot-dot { position: absolute; width: 8px; height: 8px; border-radius: 50%; transform: translate(-50%, -50%); background: currentColor; box-shadow: 0 0 0 2px var(--bg), 0 0 calc(var(--halo) * 12px) currentColor; pointer-events: none; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font: 500 10px/1.2 var(--f-data); letter-spacing: .06em; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 3px; margin-right: 6px; vertical-align: middle; border-radius: 2px; }
.tray { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 16px; }
.chip { border: 1px dashed var(--line-2); border-radius: calc(var(--radius) * 4); background: none; padding: 7px 11px; font: 500 12px/1.2 var(--f-ui); color: var(--ink-2); }
.chip:hover { border-style: solid; border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
.morph { position: fixed; z-index: 35; pointer-events: none; border: 1px solid var(--accent); background: var(--surface); border-radius: 50%; }

    legend.innerHTML = "";
    return () => {
      const t = S.t, vs = names.map((n) => valAt(k, t, k.parts[n])), max = Math.max(...vs), tot = sum(vs);
      rows.forEach((r, i) => { r.bar.style.width = `${(vs[i] / max) * 100}%`; r.v.textContent = F(k, vs[i]); });
      const m = month(), prev = m >= 12 ? k.series[m - 12] : null;
      total.textContent = `Total ${F(k, tot)} · Zusagen ${pct(vs[2] / tot)} des Volumens${prev ? ` · ${fdelta(k, k.series[m] - prev, prev)} ggü. Vorjahr` : ""}`;
      return false;
    };
  },
};

function indexed(spec, plot, legend, series, caption) {
  const fr = seriesFrame(plot), st = {}, base = pl(plot);
  return (mc, card) => {
    const [w0, w1] = windowFor(spec), t = S.t, X = (m) => ((m - w0) / Math.max(1e-6, w1 - w0)) * 600;
    const a = Math.max(0, Math.floor(w0)), b = Math.min(N - 1, Math.ceil(w1));
    const lines = series.map((s) => { const b0 = s.arr[a]; const pts = []; for (let m = a; m <= b; m++) pts.push([m, (s.arr[m] / b0) * 100]); return { ...s, pts }; });
    const vals = lines.flatMap((l) => l.pts.map((p) => p[1])).concat([100]);
    let again = smooth(st, "lo", Math.min(...vals) - 2, card.first) | smooth(st, "hi", Math.max(...vals) + 2, card.first);
    const Y = (v) => 188 - ((v - st.lo) / (st.hi - st.lo)) * 176;
    fr.zones.replaceChildren(sv("line", { x1: 0, x2: 600, y1: Y(100), y2: Y(100), stroke: "var(--ink)", "stroke-opacity": 0.35, "stroke-dasharray": "2 4", ...NSS }));
    fr.ghosts.replaceChildren(...lines.map((l) => sv("path", { d: lineD(l.pts, X, Y), fill: "none", stroke: "var(--ink)", "stroke-opacity": 0.12, ...NSS })));
    fr.solid.replaceChildren(...lines.map((l) => sv("path", { d: lineD(l.pts, X, Y), fill: "none", stroke: l.color, "stroke-width": 2, ...NSS })));
    const e = introFactor(card, st);
    if (e < 1) again = true;
    fr.clip.setAttribute("width", (X(t) * e + 1).toFixed(1));
    fr.dot.hidden = true;
    base.textContent = "100"; base.style.right = "0"; base.style.top = `calc(${(Y(100) / 200) * 100}% - 13px)`;
    fr.hi.textContent = Math.round(st.hi) + ""; fr.lo.textContent = Math.round(st.lo) + "";
    fr.x0.textContent = PERIODS.monat[a].label; fr.x1.textContent = PERIODS.monat[b].label;
    const m = Math.min(b, month());
    legend.innerHTML = lines.map((l) => `<span><i style="background:${l.color}"></i>${l.name} ${Math.round(l.pts[clamp(m - a, 0, l.pts.length - 1)][1])}</span>`).join("") + `<span>${caption}</span>`;
    return again;
  };
}

function openPrinciples() {
  const scrim = h("div", { class: "scrim" });
  const close = () => { scrim.remove(); drawer.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  const drawer = h("aside", { class: "drawer", role: "dialog", "aria-modal": "true", "aria-label": "Warum Lumantic so gebaut ist" },
    h("div", { style: "display:flex;justify-content:space-between;align-items:flex-start;gap:12px" }, h("h2", { text: "Warum so?" }), h("button", { class: "btn", type: "button", onclick: close }, "Schliessen")),
    h("p", { text: "Zehn Entscheidungen hinter diesem Entwurf, jede mit ihrer Quelle." }),

  scrim.addEventListener("click", close);

document.addEventListener("keydown", (e) => {
  const tag = e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || e.target.getAttribute("role") === "slider") return;
  if (e.key === " " && tag !== "BUTTON") { e.preventDefault(); togglePlay(); }

});
