<title>Lumantic Sternatlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500;1,600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: the night sky is the page. A star atlas of key figures; brightness means urgency.
   Everything else floats on it as quiet instrument chrome, with registration marks instead of rounded cards. */
:root {
  --night: #05070f;
  --night-2: #0b1122;
  --star: #eee8d9;
  --star-2: #b4ae9f;
  --dim: #7d7a71;
  --hair: rgba(238, 232, 217, .12);
  --hair-2: rgba(238, 232, 217, .24);
  --brass: #d6b06a;
  --brass-soft: color-mix(in srgb, var(--brass) 15%, transparent);
  --alert: #ff6b4d;
  --watch: #f3b746;
  --good: #63d39f;
  --glass: rgba(8, 12, 24, .74);
  --f-voice: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --f-ui: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--star); font: 400 14px/1.5 var(--f-ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 1px solid var(--brass); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#sky.is-dragging { cursor: grabbing; }
#sky.is-pointing { cursor: pointer; }

.hud { position: fixed; z-index: 5; }
.hud-tl {
  top: calc(env(safe-area-inset-top, 0px) + 22px);
  left: max(16px, env(safe-area-inset-left, 0px));
  max-width: min(560px, calc(100% - 32px));
  pointer-events: none;
}
.hud-tl > * { pointer-events: auto; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.mark { width: 9px; height: 9px; border-radius: 50%; background: var(--brass); box-shadow: 0 0 0 4px var(--brass-soft), 0 0 22px 6px var(--brass-soft); align-self: center; }
.word { font: 600 19px/1 var(--f-ui); letter-spacing: -.01em; }
.slogan { font: italic 500 17px/1 var(--f-voice); color: var(--star-2); }
.brief {
  margin: 26px 0 0; font: italic 500 clamp(26px, 3.4vw, 40px)/1.07 var(--f-voice);
  letter-spacing: -.005em; text-wrap: balance; max-width: 15em; color: var(--star);
}
.brief .name {
  border: 0; background: none; padding: 0; font: inherit; color: var(--brass);
  text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 6px; text-decoration-color: color-mix(in srgb, var(--brass) 40%, transparent);
}
.brief .name--alert { color: color-mix(in srgb, var(--alert) 70%, var(--star)); text-decoration-color: color-mix(in srgb, var(--alert) 45%, transparent); }
.brief .name:hover { text-decoration-color: currentColor; }
.brief.is-changing { animation: shimmer .7s ease-out; }
@keyframes shimmer { 0% { opacity: .35; filter: blur(3px); } 100% { opacity: 1; filter: none; } }
.meta { margin: 14px 0 0; font: 400 10.5px/1.5 var(--f-data); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }

.hud-tr {
  top: calc(env(safe-area-inset-top, 0px) + 18px);
  right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; max-width: 46vw;
}
.chip {
  border: 1px solid var(--hair-2); background: rgba(5, 7, 15, .5); border-radius: 0;
  padding: 7px 12px; font: 500 10.5px/1 var(--f-data); letter-spacing: .14em; text-transform: uppercase; color: var(--star-2);
  backdrop-filter: blur(6px); transition: color .2s, border-color .2s, background .2s;
}
.chip:hover { color: var(--star); border-color: var(--star-2); }
.chip--brass { color: var(--brass); border-color: color-mix(in srgb, var(--brass) 45%, transparent); }
.chip--brass:hover, .chip--brass[aria-pressed="true"] { background: var(--brass-soft); color: var(--star); }
.swatches { display: flex; gap: 6px; padding: 0 2px 0 6px; }
.swatch { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--hair-2); padding: 0; background: var(--c); box-shadow: inset 0 0 0 3px var(--night); }
.swatch[aria-checked="true"] { border-color: var(--star); box-shadow: inset 0 0 0 3px var(--night), 0 0 12px var(--c); }

.legend {
  left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
  font: 400 10px/1 var(--f-data); letter-spacing: .14em; text-transform: uppercase; color: var(--dim);
}
.legend p { margin: 0 0 10px; color: var(--star-2); }
.legend ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.legend li { display: flex; align-items: center; gap: 10px; }
.legend i { width: 14px; height: 14px; display: inline-grid; place-items: center; flex: none; }
.legend i::before { content: ""; border-radius: 50%; }
.l-alert::before { width: 7px; height: 7px; background: #fff; box-shadow: 0 0 6px 3px var(--alert), 0 0 14px 6px color-mix(in srgb, var(--alert) 40%, transparent); }
.l-watch::before { width: 5px; height: 5px; background: #fff7e6; box-shadow: 0 0 5px 2px var(--watch); }
.l-calm::before { width: 3px; height: 3px; background: var(--star-2); opacity: .7; }
.l-ring::before { width: 11px; height: 11px; border: 1px solid var(--star-2); border-right-color: transparent; transform: rotate(45deg); }
.l-note::before { width: 6px; height: 6px; border: 1px solid var(--brass); border-radius: 0; transform: rotate(45deg); }

.zoom {
  right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
  display: flex; flex-direction: column;
}
.zoom button { width: 34px; height: 34px; border: 1px solid var(--hair-2); background: rgba(5, 7, 15, .5); color: var(--star-2); font: 400 16px/1 var(--f-data); }
.zoom button + button { border-top: 0; }
.zoom button:hover { color: var(--star); }

.hud-bottom {
  left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  display: flex; flex-direction: column; align-items: center; gap: 14px; width: min(620px, calc(100% - 32px));
}
.ask {
  display: flex; align-items: center; gap: 12px; width: min(440px, 100%);
  border: 1px solid var(--hair-2); background: rgba(5, 7, 15, .62); backdrop-filter: blur(10px);
  padding: 11px 14px; text-align: left; color: var(--star-2); font: italic 500 17px/1 var(--f-voice);
  transition: border-color .25s, box-shadow .25s, color .25s;
}
.ask:hover { border-color: color-mix(in srgb, var(--brass) 60%, transparent); color: var(--star); box-shadow: 0 0 34px var(--brass-soft); }
.ask .glyph { color: var(--brass); font: 400 15px/1 var(--f-ui); }
.ask span:nth-child(2) { flex: 1; }
.ask kbd { font: 400 10px/1 var(--f-data); letter-spacing: .1em; color: var(--dim); border: 1px solid var(--hair); padding: 4px 6px; }

.timeline { display: flex; align-items: flex-end; gap: 14px; width: 100%; }
.play { width: 30px; height: 30px; flex: none; border: 1px solid var(--hair-2); background: none; color: var(--brass); font: 400 11px/1 var(--f-data); display: grid; place-items: center; }
.play[aria-pressed="true"] { background: var(--brass-soft); }
.track { flex: 1; display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); position: relative; touch-action: none; }
.track::before { content: ""; position: absolute; left: 0; right: 0; bottom: 18px; height: 1px; background: var(--hair-2); }
.tick { border: 0; background: none; padding: 0; height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 5px; position: relative; color: var(--dim); }
.tick .burn { display: flex; gap: 2px; height: 5px; align-items: flex-end; }
.tick .burn i { width: 3px; height: 3px; border-radius: 50%; background: var(--alert); box-shadow: 0 0 4px var(--alert); }
.tick .burn i.w { background: var(--watch); box-shadow: 0 0 4px var(--watch); }
.tick .line { width: 1px; height: 7px; background: var(--hair-2); }
.tick .kw { font: 400 9.5px/1 var(--f-data); letter-spacing: .06em; }
.tick:hover .kw { color: var(--star); }
.tick[aria-current="true"] { color: var(--brass); }
.tick[aria-current="true"] .line { height: 13px; width: 2px; background: var(--brass); box-shadow: 0 0 10px var(--brass); }
.tick.is-future .kw { opacity: .45; }

/* Star card: glass with registration marks */
.panel {
  position: fixed; z-index: 6;
  top: calc(env(safe-area-inset-top, 0px) + 74px); bottom: calc(env(safe-area-inset-bottom, 0px) + 150px);
  right: max(16px, env(safe-area-inset-right, 0px)); width: min(392px, calc(100% - 32px));
  background: var(--glass); backdrop-filter: blur(16px) saturate(1.15);
  border: 1px solid var(--hair);
  display: flex; flex-direction: column;
  animation: panel-in .55s cubic-bezier(.2, .8, .2, 1);
}
@keyframes panel-in { from { opacity: 0; transform: translateX(18px); filter: blur(6px); } }
.panel .reg { position: absolute; width: 12px; height: 12px; border-color: var(--brass); border-style: solid; border-width: 0; pointer-events: none; animation: reg-in .7s .15s cubic-bezier(.2, .8, .2, 1) backwards; }
.reg.tl { top: -1px; left: -1px; border-top-width: 1px; border-left-width: 1px; }
.reg.tr { top: -1px; right: -1px; border-top-width: 1px; border-right-width: 1px; }
.reg.bl { bottom: -1px; left: -1px; border-bottom-width: 1px; border-left-width: 1px; }
.reg.br { bottom: -1px; right: -1px; border-bottom-width: 1px; border-right-width: 1px; }
@keyframes reg-in { from { width: 0; height: 0; opacity: 0; } }
.panel-body { overflow-y: auto; padding: 20px 22px 18px; display: flex; flex-direction: column; gap: 16px; scrollbar-width: thin; scrollbar-color: var(--hair-2) transparent; }

.p-head { display: flex; align-items: center; gap: 10px; }
.p-con { font: 400 10px/1 var(--f-data); letter-spacing: .18em; text-transform: uppercase; color: var(--dim); flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 7px; font: 500 10px/1 var(--f-data); letter-spacing: .12em; text-transform: uppercase; padding: 5px 9px 5px 8px; border: 1px solid var(--hair-2); color: var(--star); }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--star-2); }
.pill[data-level="alert"] { border-color: color-mix(in srgb, var(--alert) 50%, transparent); } .pill[data-level="alert"] i { background: var(--alert); box-shadow: 0 0 8px var(--alert); }
.pill[data-level="watch"] { border-color: color-mix(in srgb, var(--watch) 45%, transparent); } .pill[data-level="watch"] i { background: var(--watch); box-shadow: 0 0 8px var(--watch); }
.pill[data-level="good"] { border-color: color-mix(in srgb, var(--good) 45%, transparent); } .pill[data-level="good"] i { background: var(--good); box-shadow: 0 0 8px var(--good); }
.pill[data-level="info"] i { background: var(--brass); }
.x { border: 0; background: none; color: var(--dim); font: 300 22px/1 var(--f-ui); width: 26px; height: 26px; }
.x:hover { color: var(--star); }
.p-q { margin: 0; font: 600 25px/1.12 var(--f-voice); letter-spacing: -.005em; text-wrap: balance; }
.p-fig { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.p-val { font: 400 44px/1 var(--f-data); letter-spacing: -.04em; }
.p-val small { font-size: 12px; letter-spacing: .08em; color: var(--star-2); margin-left: 8px; text-transform: uppercase; }
.p-delta { font: 400 11px/1.4 var(--f-data); color: var(--star-2); letter-spacing: .04em; }
.voice { margin: 0; font: italic 500 19px/1.3 var(--f-voice); color: var(--star); }
.voice b { font-weight: 600; font-style: italic; color: var(--brass); }
.voice-by { display: block; font: 400 9.5px/1 var(--f-data); letter-spacing: .18em; text-transform: uppercase; color: var(--dim); margin-bottom: 7px; font-style: normal; }
.forms { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--hair); }
.forms button { border: 0; background: none; padding: 8px 0; font: 400 10px/1 var(--f-data); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.forms button + button { border-left: 1px solid var(--hair); }
.forms button[aria-pressed="true"] { color: var(--star); background: var(--brass-soft); }
.chart { position: relative; min-height: 170px; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart-tip { position: absolute; transform: translate(-50%, -100%); font: 400 10.5px/1.3 var(--f-data); background: var(--star); color: var(--night); padding: 4px 7px; pointer-events: none; white-space: nowrap; }
.rule { font: 400 10.5px/1.4 var(--f-data); letter-spacing: .12em; text-transform: uppercase; color: var(--star-2); display: flex; gap: 10px; align-items: center; }
.rule::before { content: ""; width: 14px; height: 1px; background: var(--brass); }
details.how { border-top: 1px solid var(--hair); padding-top: 12px; }
details.how summary { cursor: pointer; font: 400 10.5px/1 var(--f-data); letter-spacing: .14em; text-transform: uppercase; color: var(--star-2); list-style: none; }
details.how summary::before { content: "+ "; color: var(--brass); }
details.how[open] summary::before { content: "− "; }
details.how p { margin: 10px 0 0; font-size: 13px; color: var(--star-2); }
details.how pre { margin: 10px 0 0; font: 400 11px/1.55 var(--f-data); color: var(--star); background: rgba(0, 0, 0, .35); border: 1px solid var(--hair); padding: 10px 12px; overflow-x: auto; }
.links { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--hair); padding-top: 12px; }
.links h3 { margin: 0; font: 400 10px/1 var(--f-data); letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
.link { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 4px 0; text-align: left; color: var(--star); font: italic 500 17px/1.2 var(--f-voice); }
.link i { width: 6px; height: 6px; flex: none; border: 1px solid var(--brass); transform: rotate(45deg); }
.link i.dot { border: 0; border-radius: 50%; transform: none; background: var(--star-2); }
.link i.dot[data-level="alert"] { background: var(--alert); box-shadow: 0 0 6px var(--alert); }
.link i.dot[data-level="watch"] { background: var(--watch); }
.link i.dot[data-level="good"] { background: var(--good); }
.link:hover { color: var(--brass); }
.p-nav { display: flex; justify-content: space-between; border-top: 1px solid var(--hair); padding-top: 12px; }
.p-nav button { border: 0; background: none; font: 400 10px/1 var(--f-data); letter-spacing: .14em; text-transform: uppercase; color: var(--star-2); padding: 4px 0; }
.p-nav button:hover { color: var(--brass); }
.note-text { margin: 0; font: italic 400 21px/1.35 var(--f-voice); color: var(--star); }

.bars { display: grid; gap: 12px; padding-top: 4px; }
.bar-row { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 10px; align-items: center; font: 400 10.5px/1 var(--f-data); letter-spacing: .06em; color: var(--star-2); }
.bar-track { position: relative; height: 18px; display: flex; align-items: center; }
.bar-beam { height: 2px; background: linear-gradient(90deg, transparent, var(--c)); box-shadow: 0 0 10px var(--c); transition: width .7s cubic-bezier(.2, .8, .2, 1); position: relative; }
.bar-beam::after { content: ""; position: absolute; right: -3px; top: -2px; width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px 2px var(--c); }
.bar-mark { position: absolute; top: 2px; bottom: 2px; width: 1px; background: var(--star-2); opacity: .55; transition: left .7s cubic-bezier(.2, .8, .2, 1); }
.bar-val { position: absolute; right: 0; top: -12px; color: var(--star); }
.bar-legend { font: 400 9.5px/1.4 var(--f-data); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); display: flex; gap: 14px; }

.heat { display: grid; gap: 3px; }
.heat-row { display: grid; grid-template-columns: 62px repeat(14, minmax(0, 1fr)); gap: 3px; align-items: center; }
.heat-row span:first-child { font: 400 9.5px/1 var(--f-data); color: var(--star-2); letter-spacing: .04em; }
.cell { aspect-ratio: 1; background: var(--c, transparent); border: 1px solid transparent; transition: background .6s; }
.cell.is-now { border-color: var(--star); }
.cell.is-future { opacity: .18; }
.heat-axis { display: grid; grid-template-columns: 62px repeat(14, minmax(0, 1fr)); gap: 3px; font: 400 8.5px/1 var(--f-data); color: var(--dim); }
.heat-axis span { text-align: center; }

.tip {
  position: fixed; z-index: 7; pointer-events: none; max-width: 260px;
  background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--hair-2); padding: 10px 12px;
  font: italic 500 16px/1.25 var(--f-voice); color: var(--star); animation: fade .2s ease-out;
}
.tip small { display: block; font: 400 9.5px/1 var(--f-data); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); font-style: normal; margin-bottom: 6px; }
@keyframes fade { from { opacity: 0; } }

.palette { position: fixed; inset: 0; z-index: 9; background: rgba(2, 3, 8, .55); display: grid; justify-items: center; align-items: start; padding-top: 16vh; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); animation: fade .2s; }
.palette-box { width: min(560px, 100%); background: var(--glass); backdrop-filter: blur(18px); border: 1px solid var(--hair-2); position: relative; animation: rise .3s cubic-bezier(.2, .8, .2, 1); }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } }
.palette input { width: 100%; border: 0; border-bottom: 1px solid var(--hair); background: none; padding: 18px 20px; font: italic 500 22px/1.2 var(--f-voice); color: var(--star); outline: none; }
.palette input::placeholder { color: var(--dim); }
.palette ul { list-style: none; margin: 0; padding: 6px 0; max-height: 46vh; overflow-y: auto; }
.palette li { display: flex; align-items: center; gap: 12px; padding: 10px 20px; cursor: pointer; }
.palette li[aria-selected="true"] { background: var(--brass-soft); }
.palette li b { font: 500 14px/1.3 var(--f-ui); flex: 1; color: var(--star); }
.palette li small { font: 400 9.5px/1 var(--f-data); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.palette li i { width: 6px; height: 6px; flex: none; border-radius: 50%; background: var(--star-2); }
.palette li i[data-level="alert"] { background: var(--alert); box-shadow: 0 0 6px var(--alert); }
.palette li i[data-level="watch"] { background: var(--watch); }
.palette li i[data-level="good"] { background: var(--good); }
.palette li i.new { background: none; border: 1px solid var(--brass); }
.palette li i.note { border-radius: 0; background: none; border: 1px solid var(--brass); transform: rotate(45deg); }
.palette-hint { margin: 0; padding: 10px 20px 14px; border-top: 1px solid var(--hair); font: 400 9.5px/1.4 var(--f-data); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }

.toast { position: fixed; z-index: 8; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); margin: 0; background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--hair-2); padding: 10px 16px; font: italic 500 17px/1.3 var(--f-voice); color: var(--star); max-width: calc(100% - 32px); animation: rise .3s; }

@media (max-width: 760px) {
  .legend, .zoom { display: none; }
  .hud-tr { max-width: none; left: max(16px, env(safe-area-inset-left, 0px)); top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 132px); justify-content: center; }
  .brief { margin-top: 18px; font-size: 25px; }
  .panel { top: auto; bottom: 0; left: 0; right: 0; width: auto; max-height: 64%; border-left: 0; border-right: 0; border-bottom: 0; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); animation-name: sheet-in; }
  @keyframes sheet-in { from { transform: translateY(30px); opacity: 0; } }
  .tick .kw { font-size: 8px; }
  .tick:nth-child(odd) .kw { visibility: hidden; }
  .ask kbd { display: none; }
  body.has-panel .hud-bottom, body.has-panel .hud-tr { visibility: hidden; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<canvas id="sky" aria-label="Sternatlas der Kennzahlen: helle Sterne brauchen Aufmerksamkeit, schwach glimmende sind ruhig." role="img"></canvas>

<header class="hud hud-tl">
  <div class="brand"><span class="mark" aria-hidden="true"></span><span class="word">lumantic</span><span class="slogan">Quiet until it matters.</span></div>
  <h1 class="brief" id="brief">Der Himmel über dem Goldlayer.</h1>
  <p class="meta" id="meta">Retail Banking · Beispieldaten</p>
</header>

<nav class="hud hud-tr" aria-label="Ansicht">
  <button class="chip" id="btn-overview" type="button">Übersicht</button>
  <button class="chip chip--brass" id="btn-tour" type="button" aria-pressed="false">✦ Lumina führt</button>

const BY_ID = Object.fromEntries(METRICS.map((m) => [m.id, m]));

const NOTE_BY_ID = Object.fromEntries(NOTES.map((n) => [n.id, n]));

// ───────────── Format (Swiss) ─────────────
const MONTHS = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
const DAYS = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const thousands = (v) => (v < 0 ? "−" : "") + Math.abs(Math.round(v)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "’");
const dec = (v, p) => String(Number(v.toFixed(p)));
function fmt(v, unit) {
  if (unit === "CHF") return Math.abs(v) >= 1e6 ? [dec(v / 1e6, 1), "Mio. CHF"] : [thousands(v), "CHF"];
  if (unit === "von 10" || unit === "Min.") return [v.toFixed(1), unit];
  return [Number.isInteger(v) || Math.abs(v) >= 100 ? thousands(v) : dec(v, 1), ""];
}
const fmtPlain = (v, unit) => fmt(v, unit).filter(Boolean).join(" ");
const fmtDelta = (v, unit) => (unit === "von 10" ? dec(Math.abs(v), 1) + " Punkte" : fmtPlain(Math.abs(v), unit));
const pct = (d) => { const p = Math.abs(d * 100); return (p < 10 ? dec(p, 1) : String(Math.round(p))) + " %"; };
const scaleUnit = (u) => u === "von 10" || u === "Min.";
function stand(i) { const d = new Date(WEEKS[i].date.getTime() + 7 * 864e5); return `${DAYS[d.getUTCDay()]}, ${d.getUTCDate()}. ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}, 06:00`; }
const joinDe = (xs) => (xs.length < 2 ? xs.join("") : xs.slice(0, -1).join(", ") + " und " + xs[xs.length - 1]);
const isoDate = (i) => WEEKS[i].date.toISOString().slice(0, 10);

// ───────────── Engine (same rules as the Go server) ─────────────
const sum = (xs) => xs.reduce((a, b) => a + b, 0);
const mean = (xs) => (xs.length ? sum(xs) / xs.length : 0);
function totalAt(m, i, src) { const vals = Object.values(src || m.groups).map((g) => g[i]); return m.agg === "avg" ? mean(vals) : sum(vals); }
const seriesOf = (m) => WEEKS.map((_, i) => totalAt(m, i));
const cmpOf = (m) => (m.cmp ? WEEKS.map((_, i) => totalAt(m, i, m.cmp)) : null);

const evalCache = new Map();
function evaluate(m, i) {
  const key = m.id + ":" + i;
  if (evalCache.has(key)) return evalCache.get(key);
  const all = seriesOf(m), cmp = cmpOf(m);
  const cur = all[i], prev = i > 0 ? all[i - 1] : null;
  const past = all.slice(Math.max(0, i - 8), i);
  const mu = mean(past), sd = Math.sqrt(mean(past.map((x) => (x - mu) ** 2)));
  let z = 0;
  if (sd > 1e-9 && mu && Math.abs(cur - mu) / Math.abs(mu) >= 0.05) z = (cur - mu) / sd;
  let dir = 0, thr = null, margin = null;
  if (m.rule) {
    dir = m.rule.op === ">=" ? 1 : -1;
    thr = m.rule.vs ? cmp[i] : m.rule.value;
    margin = ((cur - thr) / Math.abs(thr)) * dir;
  }
  let level = "calm", tone = "neutral", label = "Ruhig", byMove = false;
  if (margin !== null && margin < -0.03) { level = "alert"; tone = "bad"; label = "Braucht dich"; }
  else if (margin !== null && margin < 0) { level = "watch"; tone = "bad"; label = "Knapp verfehlt"; }
  else if (Math.abs(z) >= 2 && dir !== 0 && Math.sign(z) !== dir) { level = "watch"; tone = "bad"; label = "Auffällige Bewegung"; byMove = true; }
  else if (Math.abs(z) >= 2) { level = "notable"; byMove = true; label = dir ? "Gute Nachricht" : "Ungewöhnlich"; tone = dir ? "good" : "neutral"; }

  const score = level === "alert" ? 1000 + Math.abs(margin) * 100 : level === "watch" ? 600 + Math.abs(margin ?? z) : level === "notable" ? 500 + Math.abs(z) : 100;
  const mag = level === "alert" ? Math.min(1, 0.86 + Math.abs(margin) * 0.3) : level === "watch" ? 0.6 : level === "notable" ? 0.52 : 0.2;
  const groups = Object.keys(m.groups).map((name) => ({
    name, v: m.groups[name][i], prev: i > 0 ? m.groups[name][i - 1] : null, c: m.cmp ? m.cmp[name][i] : null,
  })).sort((a, b) => b.v - a.v);

  const r = {
    m, i, cur, prev, all, cmp, thr, margin, z, dir, level, tone, label, score, mag, groups,
    ratio: thr ? cur / thr : null,
    answer: answer(m, cur, thr, margin, byMove, all.slice(0, i + 1), z),
    delta: delta(cur, prev, m.unit),
    why: level === "alert" || level === "watch" ? driver(m, groups, dir) : "",
    ruleText: m.rule ? `Gut ist, wenn ${m.rule.op === ">=" ? "mindestens" : "höchstens"} ${m.rule.vs || fmtPlain(m.rule.value, m.unit)}` : "Ohne Regel: meldet sich nur bei ungewöhnlichen Bewegungen",
  };
  r.kind = level === "notable" ? (tone === "good" ? "good" : "info") : level;

function answer(m, cur, thr, margin, byMove, series, z) {
  if (m.rule && m.rule.vs && thr) {
    const d = cur / thr - 1, name = m.rule.vs;
    if (Math.abs(d) < 0.0005) return "Ja, genau im " + name;
    if (m.rule.op === "<=") return d > 0 ? `Nein, ${pct(d)} über ${name}` : `Ja, ${pct(d)} unter ${name}`;
    return d >= 0 ? `Ja, ${pct(d)} über ${name}` : `Nein, ${pct(d)} unter ${name}`;
  }
  if (byMove) {
    const c = series[series.length - 1], before = series.slice(0, -1), n = series.length;
    if (n > 4 && before.every((v) => c > v)) return `Höchster Wert der letzten ${n} Wochen`;
    if (n > 4 && before.every((v) => c < v)) return `Tiefster Wert der letzten ${n} Wochen`;
    return z > 0 ? "Deutlich höher als üblich" : "Deutlich tiefer als üblich";
  }
  if (m.rule && margin !== null) {
    const limit = fmtPlain(thr, m.unit);
    if (m.rule.op === "<=" && margin < 0) return `${pct(margin)} über der Grenze von ${limit}`;
    if (m.rule.op === ">=" && margin < 0) return `${pct(margin)} unter dem Ziel von ${limit}`;
    if (margin < 0.05) return m.rule.op === "<=" ? `Knapp unter der Grenze von ${limit}` : `Knapp über dem Ziel von ${limit}`;
    return "Im grünen Bereich";
  }
  return "Im üblichen Rahmen";
}

function delta(cur, prev, unit) {
  if (prev === null) return "";
  const diff = cur - prev;
  if (scaleUnit(unit)) return Math.abs(diff) < 0.05 ? "Wie in der Vorwoche" : `${diff > 0 ? "↑" : "↓"} ${fmtDelta(diff, unit)} gegenüber Vorwoche`;
  const d = diff / Math.abs(prev);
  return Math.abs(d) < 0.005 ? "Wie in der Vorwoche" : `${d > 0 ? "↑" : "↓"} ${pct(d)} gegenüber Vorwoche`;
}

// Names a group only when it clearly explains the deviation.
function driver(m, groups, dir) {
  const vsRule = !!(m.rule && m.rule.vs);
  const scored = groups.map((g) => {
    let s = 0;
    if (vsRule && g.c !== null) s = (g.v - g.c) * -dir;
    else if (g.prev !== null) s = dir === 0 ? Math.abs(g.v - g.prev) : (g.v - g.prev) * -dir;
    return { g, s };

  if (!scored.length || scored[0].s <= 0 || (scored[1] && scored[0].s < 1.5 * Math.max(0, scored[1].s))) return "";
  const g = scored[0].g;
  if (vsRule) { const d = g.v - g.c; return `Grund: ${g.name}, ${fmtDelta(d, m.unit)} ${d > 0 ? "über" : "unter"} ${m.rule.vs}`; }
  const d = g.v - g.prev;

}

// ───────────── Camera ─────────────
const OVERVIEW = { t: [0, 8, 24], dist: 620, pitch: 0.34 };
const cam = { t: OVERVIEW.t.slice(), yaw: 0.78, pitch: 0.36, dist: reduced ? OVERVIEW.dist : 1750, fov: (48 * Math.PI) / 180 };
let fly = null, B = null;
const shift = { x: 0, y: 0, gx: 0, gy: 0 };

function flyTo(to, dur = 1500) {

const cv = document.getElementById("sky");
const ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, bg = null;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bg = null;

}
function setShift() {

  shift.gy = open && W <= 760 ? -H * 0.2 : 0;

function basis() {

  const C = [cam.t[0] + cam.dist * cp * Math.sin(cam.yaw), cam.t[1] + cam.dist * Math.sin(cam.pitch), cam.t[2] + cam.dist * cp * Math.cos(cam.yaw)];

// ───────────── Drawing ─────────────
let T = 0, hits = [], hover = null;
const bursts = [];

  ctx.globalCompositeOperation = "lighter";

  }

}

function drawBursts(now) {

  drawArmillary();

let last = performance.now();
function frame() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!document.hidden) {
    T += dt;
    if (fly) {
      const k = clamp((now - fly.t0) / fly.dur, 0, 1), e = easeInOut(k);
      cam.t = lerp3(fly.from.t, fly.to.t, e);
      cam.yaw = lerp(fly.from.yaw, fly.to.yaw, e);
      cam.pitch = lerp(fly.from.pitch, fly.to.pitch, e);
      cam.dist = Math.exp(lerp(Math.log(fly.from.dist), Math.log(fly.to.dist), e));
      if (k >= 1) fly = null;
    } else if (!reduced && !S.focus && !drag && now - S.lastInput > 6000) {
      cam.yaw += dt * 0.03;
    }
    const ks = 1 - Math.exp(-dt * 5);
    shift.x += (shift.gx - shift.x) * ks; shift.y += (shift.gy - shift.y) * ks;

      for (let c = 0; c < 3; c++) s.vis.col[c] += (g.col[c] - s.vis.col[c]) * kv;
      if (s.birth) {

        if (k >= 1) { s.birth = null; burst(s.m.pos, kindColor(s.r.kind)); }
      }
    }
    basis();
    draw(now);
  }
  requestAnimationFrame(frame);
}

// ───────────── Pointer: orbit, zoom, hover, pick ─────────────
let drag = null, pinch = null;
const pointers = new Map();
const tip = document.getElementById("tip");
function touch() { S.lastInput = performance.now(); if (S.tour) stopTour(); }
function pick(x, y) {

  for (const h of hits) { const d = Math.hypot(h.x - x, h.y - y); if (d < h.r + 6 && d < bd) { best = h; bd = d; } }
  return best;
}
function showTip(h, x, y) {
  if (!h) { tip.hidden = true; return; }
  let head = "", body = "";
  if (h.type === "star") { const r = STAR[h.id].r; head = `${CONSTELLATIONS[r.m.con]} · ${r.label}`; body = `${r.m.short}: ${r.answer}`; }
  else if (h.type === "note") { const n = NOTE_BY_ID[h.id]; head = "Notiz"; body = n.title; }
  else { head = "Goldlayer"; body = "Retail Banking. Klick für die Übersicht."; }
  tip.replaceChildren(Object.assign(document.createElement("small"), { textContent: head }), body);
  tip.hidden = false;
  const tw = tip.offsetWidth, th = tip.offsetHeight;

cv.addEventListener("pointerdown", (e) => {
  touch();

    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), dist: cam.dist };
    drag = null;
  } else {
    drag = { x: e.clientX, y: e.clientY, moved: 0 };

});
cv.addEventListener("pointermove", (e) => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    cam.dist = clamp((pinch.dist * pinch.d) / Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)), 70, 1900);
    fly = null;
    return;
  }
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    drag.x = e.clientX; drag.y = e.clientY;
    if (drag.moved > 4) {
      fly = null;
      cam.yaw -= dx * 0.0045;
      cam.pitch = clamp(cam.pitch + dy * 0.0035, -1.15, 1.15);
      cv.classList.add("is-dragging");

function endPointer(e) {

cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", endPointer);
cv.addEventListener("pointerleave", () => { hover = null; tip.hidden = true; });
cv.addEventListener("wheel", (e) => {
  e.preventDefault();
  touch();
  fly = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0011), 70, 1900);
}, { passive: false });
cv.addEventListener("dblclick", (e) => { if (!pick(e.clientX, e.clientY)) overview(); });
document.getElementById("zoom-in").addEventListener("click", () => { touch(); flyTo({ dist: clamp(cam.dist * 0.7, 70, 1900) }, 500); });
document.getElementById("zoom-out").addEventListener("click", () => { touch(); flyTo({ dist: clamp(cam.dist * 1.4, 70, 1900) }, 500); });

function activate(h) {
  tip.hidden = true;
  if (h.type === "star") focusStar(h.id);
  else if (h.type === "note") focusNote(h.id);
  else overview();
}

  const { nodes, mount } = starPanel(id);

  const alerts = ev.filter((r) => r.level === "alert"), watches = ev.filter((r) => r.level === "watch"), goods = ev.filter((r) => r.level === "notable" && r.tone === "good");
  let parts;
  if (!alerts.length && !watches.length) parts = ["Alles ruhig. ", ...(goods.length ? ["Gute Nachricht: ", ...joinNodes(goods), "."] : ["Nichts braucht dich."])];
  else if (!alerts.length) parts = ["Fast alles ruhig. Behalte ", ...joinNodes(watches), " im Auge."];
  else if (alerts.length === 1 && !watches.length) parts = ["Ruhiger Tag. Nur eine Sache braucht dich: ", nameBtn(alerts[0]), "."];
  else if (alerts.length === 1) parts = ["Eine Sache braucht dich: ", nameBtn(alerts[0]), ". Im Auge behalten: ", ...joinNodes(watches), "."];
  else parts = [`${["", "Eine", "Zwei", "Drei", "Vier", "Fünf"][alerts.length] || alerts.length} Dinge brauchen dich: `, ...joinNodes(alerts), "."];
  if ((alerts.length || watches.length) && goods.length) parts.push(" Gute Nachricht: ", ...joinNodes(goods), ".");
  briefEl.replaceChildren(...parts);
  if (changed && !reduced) { briefEl.classList.remove("is-changing"); void briefEl.offsetWidth; briefEl.classList.add("is-changing"); }
}
function renderMeta() {
  metaEl.textContent = `KW ${WEEKS[S.week].kw}${S.week < 13 ? " · Rückblick" : ""} · Stand ${stand(S.week)} · Goldlayer Retail Banking · Beispieldaten`;
}
function renderStarList() {
  document.getElementById("star-list").replaceChildren(...boardEvals(S.week).map((r) =>
    h("button", { type: "button", onclick: () => focusStar(r.m.id) }, `${r.m.short}: ${r.label}, ${fmtPlain(r.cur, r.m.unit)}`)));
}

const track = document.getElementById("track"), playBtn = document.getElementById("play");
const ticks = WEEKS.map((w, i) => {
  const b = h("button", { class: "tick", type: "button", "aria-label": `Kalenderwoche ${w.kw}` }, h("span", { class: "burn" }), h("span", { class: "line" }), h("span", { class: "kw", text: w.kw }));
  b.addEventListener("click", () => { touch(); setWeek(i); });
  track.append(b);
  return b;
});
function renderTimeline() {
  ticks.forEach((b, i) => {
    b.setAttribute("aria-current", String(i === S.week));
    b.classList.toggle("is-future", i > S.week);
    const ev = boardEvals(i), a = ev.filter((r) => r.level === "alert").length, wn = ev.filter((r) => r.level === "watch").length;
    b.querySelector(".burn").replaceChildren(...Array.from({ length: Math.min(3, a) }, () => h("i")), ...Array.from({ length: Math.min(2, wn) }, () => h("i", { class: "w" })));
  });
}
function setWeek(i, fromPlay) {
  i = clamp(i, 0, 13);
  if (!fromPlay) stopPlay();
  if (i === S.week) return;
  S.week = i;
  applyWeek(); renderBrief(true); renderMeta(); renderTimeline(); renderStarList(); refreshPanel();
}
let scrubbing = false;
track.addEventListener("pointerdown", (e) => { scrubbing = true; track.setPointerCapture(e.pointerId); scrubTo(e); });
track.addEventListener("pointermove", (e) => { if (scrubbing) scrubTo(e); });
track.addEventListener("pointerup", () => { scrubbing = false; });
track.addEventListener("pointercancel", () => { scrubbing = false; });
function scrubTo(e) {
  const b = track.getBoundingClientRect();
  touch();
  setWeek(clamp(Math.floor(((e.clientX - b.left) / b.width) * 14), 0, 13));
}
function startPlay() {
  stopTour();
  playBtn.setAttribute("aria-pressed", "true"); playBtn.textContent = "❚❚";
  if (S.week >= 13) setWeek(0, true);
  S.play = setInterval(() => { if (S.week >= 13) { stopPlay(); return; } setWeek(S.week + 1, true); }, 1250);
}
function stopPlay() {
  if (!S.play) return;
  clearInterval(S.play); S.play = null;
  playBtn.setAttribute("aria-pressed", "false"); playBtn.textContent = "▶";
}
playBtn.addEventListener("click", () => (S.play ? stopPlay() : startPlay()));

// ───────────── Tour, birth, toast ─────────────
const tourBtn = document.getElementById("btn-tour");
function startTour() {
  stopPlay();
  const list = boardEvals(S.week).filter((r) => r.level !== "calm").map((r) => r.m.id);
  if (!list.length) { toast("Alles ruhig. Lumina hat dir gerade nichts zu zeigen."); return; }
  tourBtn.setAttribute("aria-pressed", "true");
  let k = 0;
  const step = () => {
    if (k >= list.length) { stopTour(); overview(); toast("Das war alles, was dich braucht. Der Rest ist ruhig."); return; }
    focusStar(list[k++]);
    S.tour = setTimeout(step, 5200);
  };
  S.tour = -1;
  step();
}
function stopTour() {
  if (S.tour === null) return;
  clearTimeout(S.tour); S.tour = null;
  tourBtn.setAttribute("aria-pressed", "false");
}
tourBtn.addEventListener("click", () => { if (S.tour !== null) stopTour(); else { S.lastInput = performance.now(); startTour(); } });
document.getElementById("btn-overview").addEventListener("click", () => { touch(); overview(); });

const toastEl = document.getElementById("toast");
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.hidden = false;
  toastEl.style.animation = "none"; void toastEl.offsetWidth; toastEl.style.animation = "";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.hidden = true; }, 3800);
}

function birth(id) {
  const s = STAR[id];
  if (S.onBoard.has(id)) { focusStar(id); return; }
  S.onBoard.add(id);
  s.pos = [0, 0, 0];
  s.birth = { t0: performance.now() };
  applyWeek(); renderBrief(true); renderTimeline(); renderStarList();
  toast(`Lumina hat einen neuen Stern gesetzt: ${s.m.short}.`);
  setTimeout(() => focusStar(id), reduced ? 0 : 700);
}

const STOP = new Set(["sind", "viele", "woche", "unsere", "haben", "gibt", "noch", "welche", "unser", "liegt", "lange", "zeig", "mir", "bitte"]);
function askLumina(q) {
  const words = q.toLowerCase().split(/[^a-zäöüß-]+/).filter((x) => x.length > 3 && !STOP.has(x));
  let best = null, bestScore = 0;
  for (const m of METRICS) {
    const hay = (m.short + " " + m.q + " " + m.measure).toLowerCase();
    const sc = words.filter((x) => hay.includes(x)).length;
    if (sc > bestScore) { best = m; bestScore = sc; }
  }
  if (!best) { toast("Im Entwurf kennt Lumina nur die Beispieldaten. Probier «Marketingkosten»."); return; }
  if (!S.onBoard.has(best.id)) birth(best.id); else focusStar(best.id);
}

// ───────────── Command palette ─────────────
const pal = document.getElementById("palette"), palInput = document.getElementById("palette-input"), palList = document.getElementById("palette-list");
let palItems = [], palSel = 0;
function paletteItems(q) {
  const ql = q.trim().toLowerCase();
  const items = [
    { label: "Zur Übersicht", hint: "Ansicht", run: overview },
    { label: "Lumina führt dich zu den Signalen", hint: "Tour", run: startTour },
    { label: "Wochen abspielen", hint: "Zeit", run: startPlay },
    ...boardEvals(S.week).map((r) => ({ label: r.m.short, hint: r.label, level: r.kind, run: () => focusStar(r.m.id) })),
    ...NOTES.map((n) => ({ label: n.title, hint: "Notiz", icon: "note", run: () => focusNote(n.id) })),
    ...METRICS.filter((m) => !S.onBoard.has(m.id)).map((m) => ({ label: m.q, hint: "Neuer Stern", icon: "new", run: () => birth(m.id) })),
  ];
  const found = ql ? items.filter((it) => (it.label + " " + it.hint).toLowerCase().includes(ql)) : items;
  if (ql) found.push({ label: `Lumina fragen: «${q.trim()}»`, hint: "Frage", icon: "new", run: () => askLumina(q.trim()) });
  return found;
}
function renderPalette() {
  palList.replaceChildren(...palItems.map((it, k) => {
    const li = h("li", { role: "option", "aria-selected": String(k === palSel) }, h("i", { class: it.icon || null, "data-level": it.level || null }), h("b", { text: it.label }), h("small", { text: it.hint }));
    li.addEventListener("click", () => runItem(it));
    li.addEventListener("mouseenter", () => { palSel = k; markSel(); });
    return li;
  }));
}
function markSel() {
  [...palList.children].forEach((li, k) => li.setAttribute("aria-selected", String(k === palSel)));
  const sel = palList.children[palSel];
  if (sel) sel.scrollIntoView({ block: "nearest" });
}
function openPalette() { touch(); stopPlay(); pal.hidden = false; palInput.value = ""; palSel = 0; palItems = paletteItems(""); renderPalette(); palInput.focus(); }
function closePalette() { pal.hidden = true; }
function runItem(it) { closePalette(); it.run(); }
palInput.addEventListener("input", () => { palSel = 0; palItems = paletteItems(palInput.value); renderPalette(); });
palInput.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); palSel = Math.min(palItems.length - 1, palSel + 1); markSel(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); palSel = Math.max(0, palSel - 1); markSel(); }
  else if (e.key === "Enter") { e.preventDefault(); if (palItems[palSel]) runItem(palItems[palSel]); }
  else if (e.key === "Escape") { e.preventDefault(); closePalette(); }
});
pal.addEventListener("click", (e) => { if (e.target === pal) closePalette(); });
document.getElementById("ask").addEventListener("click", openPalette);

document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); if (pal.hidden) openPalette(); else closePalette(); return; }
  if (!pal.hidden) return;
  if (e.target.closest && e.target.closest("input, textarea")) return;
  if (e.key === "/") { e.preventDefault(); openPalette(); }
  else if (e.key === "Escape") { touch(); if (S.focus) overview(); }
  else if (e.key === "[") { touch(); setWeek(S.week - 1); }
  else if (e.key === "]") { touch(); setWeek(S.week + 1); }
});
panel.addEventListener("pointerdown", touch);

// ───────────── Corporate design: one colour, the whole sky follows ─────────────
const THEMES = { lumantic: ["#d6b06a", "Lumantic"], musterbank: ["#6f9bff", "Musterbank"], alpin: ["#45c4a8", "Alpin"] };
document.querySelectorAll(".swatch").forEach((b) => b.addEventListener("click", () => {
  const [c, name] = THEMES[b.dataset.themeId];
  document.documentElement.style.setProperty("--brass", c);
  document.querySelectorAll(".swatch").forEach((x) => x.setAttribute("aria-checked", String(x === b)));
  readTokens(); bg = null; applyWeek(); refreshPanel();
  toast(`Corporate Design «${name}»: eine Farbe, und der ganze Himmel folgt.`);
}));

// ───────────── Start ─────────────
readTokens();
resize();
applyWeek();
for (const s of stars) { s.vis.mag = s.goal.mag; s.vis.col = s.goal.col.slice(); s.vis.alpha = s.goal.alpha; }
renderBrief(false); renderMeta(); renderTimeline(); renderStarList();
if (!reduced) flyTo({ t: OVERVIEW.t, dist: OVERVIEW.dist, pitch: OVERVIEW.pitch }, 3400);
addEventListener("resize", resize);
const startId = location.hash.slice(1);
if (startId) setTimeout(() => { if (STAR[startId] && S.onBoard.has(startId)) focusStar(startId); else if (NOTE_BY_ID[startId]) focusNote(startId); }, reduced ? 0 : 1100);
if (document.fonts) document.fonts.ready.then(() => { bg = null; });
requestAnimationFrame(frame);
</script>
