<title>Lumantic ALCO-Entwürfe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500;1,600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one night sky, three ways to read it. A = instrument board, B = time stream, C = star map in an astrolabe.
   Shared language: brightness means urgency, Lumina speaks in italic serif, data speaks in mono, registration marks frame every instrument. */
:root {
  --night: #05070f;
  --night-2: #0b1122;
  --panel: rgba(12, 17, 34, .72);
  --star: #eee8d9;
  --star-2: #b4ae9f;
  --dim: #7d7a71;
  --hair: rgba(238, 232, 217, .11);
  --hair-2: rgba(238, 232, 217, .22);
  --brass: #d6b06a;
  --brass-soft: color-mix(in srgb, var(--brass) 14%, transparent);
  --alert: #ff6b4d;
  --watch: #f3b746;
  --good: #63d39f;
  --f-voice: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --f-ui: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
html { background: var(--night); }
body {
  min-height: 100%; color: var(--star); font: 400 14px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased;
  background: radial-gradient(ellipse 80% 60% at 70% 0%, color-mix(in srgb, var(--brass) 6%, var(--night-2)) 0%, var(--night) 60%) fixed, var(--night);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--night); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 1px solid var(--brass); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--f-data); }
.label { font: 400 10px/1.3 var(--f-data); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }

/* ── Top bar ── */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 14px 28px; flex-wrap: wrap;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 14px;
  background: color-mix(in srgb, var(--night) 82%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--hair);
}
.brand { display: flex; align-items: baseline; gap: 12px; }
.mark { width: 9px; height: 9px; border-radius: 50%; background: var(--brass); box-shadow: 0 0 0 4px var(--brass-soft), 0 0 20px 6px var(--brass-soft); align-self: center; }
.word { font: 600 18px/1 var(--f-ui); letter-spacing: -.01em; }
.slogan { font: italic 500 16px/1 var(--f-voice); color: var(--star-2); }
.tabs { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.tab { border: 1px solid transparent; background: none; padding: 8px 12px; font: 500 10.5px/1 var(--f-data); letter-spacing: .14em; text-transform: uppercase; color: var(--star-2); }
.tab b { color: var(--brass); font-weight: 500; margin-right: 6px; }
.tab:hover { color: var(--star); }
.tab[aria-selected="true"] { color: var(--star); border-color: var(--hair-2); background: var(--brass-soft); }
.source { font: 400 10px/1.3 var(--f-data); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }

.brief-wrap { padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 26px 6px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 30px; }
.brief { margin: 0; font: italic 500 clamp(24px, 3vw, 36px)/1.1 var(--f-voice); max-width: 24em; text-wrap: balance; }
.brief .name { border: 0; background: none; padding: 0; font: inherit; color: var(--brass); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px; text-decoration-color: color-mix(in srgb, var(--brass) 40%, transparent); }
.brief .name--alert { color: color-mix(in srgb, var(--alert) 72%, var(--star)); text-decoration-color: color-mix(in srgb, var(--alert) 40%, transparent); }
.brief .name:hover { text-decoration-color: currentColor; }
.brief.is-changing { animation: shimmer .7s ease-out; }
@keyframes shimmer { from { opacity: .35; filter: blur(3px); } }
.period { text-align: right; }
.period strong { display: block; font: 400 22px/1.1 var(--f-data); letter-spacing: -.02em; color: var(--star); }

.concept { padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 18px 90px; }
.concept-note { margin: 0 0 18px; font: italic 500 17px/1.35 var(--f-voice); color: var(--star-2); max-width: 62ch; }

/* ── Status pill and registration marks (shared language) ── */
.pill { display: inline-flex; align-items: center; gap: 7px; font: 500 9.5px/1 var(--f-data); letter-spacing: .12em; text-transform: uppercase; padding: 5px 8px 5px 7px; border: 1px solid var(--hair-2); color: var(--star); white-space: nowrap; }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--star-2); opacity: .7; }
.pill[data-level="alert"] { border-color: color-mix(in srgb, var(--alert) 50%, transparent); } .pill[data-level="alert"] i { background: var(--alert); opacity: 1; box-shadow: 0 0 8px var(--alert); }
.pill[data-level="watch"] { border-color: color-mix(in srgb, var(--watch) 45%, transparent); } .pill[data-level="watch"] i { background: var(--watch); opacity: 1; box-shadow: 0 0 8px var(--watch); }
.pill[data-level="good"] { border-color: color-mix(in srgb, var(--good) 45%, transparent); } .pill[data-level="good"] i { background: var(--good); opacity: 1; box-shadow: 0 0 8px var(--good); }
.pill[data-level="info"] i { background: var(--brass); opacity: 1; }
.pill[data-level="calm"] { color: var(--star-2); border-color: var(--hair); }
.reg { position: absolute; width: 10px; height: 10px; border: 0 solid var(--brass); pointer-events: none; opacity: .75; }
.reg.tl { top: -1px; left: -1px; border-top-width: 1px; border-left-width: 1px; }
.reg.tr { top: -1px; right: -1px; border-top-width: 1px; border-right-width: 1px; }
.reg.bl { bottom: -1px; left: -1px; border-bottom-width: 1px; border-left-width: 1px; }
.reg.br { bottom: -1px; right: -1px; border-bottom-width: 1px; border-right-width: 1px; }

/* ── Module (instrument) ── */
.mod {
  position: relative; min-width: 0; display: flex; flex-direction: column; gap: 10px;
  padding: 16px 18px 14px; border: 1px solid var(--hair);
  background: linear-gradient(180deg, rgba(255, 255, 255, .025), transparent 40%), var(--panel);
  backdrop-filter: blur(8px);
  transition: border-color .5s, box-shadow .5s, opacity .5s;
}
.mod.enter { animation: condense .6s cubic-bezier(.2, .8, .2, 1) backwards; }
@keyframes condense { from { opacity: 0; filter: blur(8px); transform: translateY(6px) scale(.985); } }
.mod--alert { border-color: color-mix(in srgb, var(--alert) 34%, transparent); box-shadow: 0 0 46px -14px color-mix(in srgb, var(--alert) 55%, transparent); animation: breathe 3.4s ease-in-out infinite; }
.mod--alert.enter { animation: condense .6s cubic-bezier(.2, .8, .2, 1) backwards, breathe 3.4s ease-in-out .6s infinite; }
.mod--alert .reg { border-color: var(--alert); }
@keyframes breathe { 50% { box-shadow: 0 0 64px -12px color-mix(in srgb, var(--alert) 70%, transparent); } }
.mod--watch { border-color: color-mix(in srgb, var(--watch) 28%, transparent); }
.mod--good { border-color: color-mix(in srgb, var(--good) 26%, transparent); }
.mod--calm { opacity: .82; }
.mod--calm:hover, .mod--calm:focus-within { opacity: 1; }
.mod.is-new { box-shadow: 0 0 0 1px var(--brass), 0 0 50px -10px var(--brass); }
.mod-head { display: flex; align-items: center; gap: 8px; min-height: 24px; }
.mod-group { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mod-tools { display: flex; gap: 2px; opacity: 0; transition: opacity .2s; }
.mod:hover .mod-tools, .mod:focus-within .mod-tools { opacity: 1; }
.mod-tools button { border: 1px solid transparent; background: none; color: var(--dim); font: 400 10px/1 var(--f-data); padding: 4px 6px; letter-spacing: .08em; }
.mod-tools button:hover, .mod-tools button[aria-pressed="true"] { color: var(--star); border-color: var(--hair-2); }
.mod-grip { cursor: grab; }
.mod-name { margin: 0; font: 600 22px/1.05 var(--f-voice); letter-spacing: -.005em; }
.mod-name small { display: block; margin-top: 4px; font: 400 9.5px/1.2 var(--f-data); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.mod-fig { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px 14px; flex-wrap: wrap; }
.mod-val { font: 400 40px/1 var(--f-data); letter-spacing: -.045em; white-space: nowrap; }
.mod-val small { font-size: 11px; letter-spacing: .1em; color: var(--star-2); margin-left: 6px; text-transform: uppercase; }
.mod-cmp { display: grid; gap: 3px; font: 400 10.5px/1.25 var(--f-data); color: var(--star-2); text-align: right; }
.mod-chart { position: relative; height: 112px; }
.mod-voice { margin: 0; font: italic 500 17px/1.3 var(--f-voice); color: var(--star); }
.mod-voice span { display: block; font: 400 9px/1 var(--f-data); font-style: normal; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); margin-bottom: 5px; }
.mod-rules { display: flex; flex-wrap: wrap; gap: 4px 16px; font: 400 9.5px/1.3 var(--f-data); letter-spacing: .1em; text-transform: uppercase; color: var(--star-2); border-top: 1px solid var(--hair); padding-top: 10px; }
.mod-rules span { display: inline-flex; align-items: center; gap: 7px; }
.mod-rules span::before { content: ""; width: 12px; height: 1px; background: var(--brass); }
.mod-rules .r-reg::before { background: var(--alert); height: 2px; }
.mod-forms { display: flex; gap: 0; border: 1px solid var(--hair); align-self: flex-start; }
.mod-forms button { border: 0; background: none; padding: 6px 10px; font: 400 9.5px/1 var(--f-data); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.mod-forms button + button { border-left: 1px solid var(--hair); }
.mod-forms button[aria-pressed="true"] { color: var(--star); background: var(--brass-soft); }
.size-L .mod-val { font-size: 54px; }
.size-L .mod-chart { height: 156px; }
.size-S .mod-val { font-size: 28px; }
.size-S .mod-chart { height: 46px; }
.size-S .mod-name { font-size: 19px; }
.size-S .mod-rules, .size-S .mod-forms, .size-S .mod-cmp span + span { display: none; }
.size-S .mod-voice { font-size: 15px; }
.mod.is-dragging { opacity: .3; }
.mod.drop-before { box-shadow: -3px 0 0 var(--brass); }

/* ── Charts ── */
.ch { position: absolute; inset: 0; }
.ch svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ch-dot { position: absolute; width: 8px; height: 8px; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 2px var(--night), 0 0 12px currentColor; background: currentColor; }
.ch-dot::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 1px solid currentColor; animation: ping 2s ease-out infinite; }
@keyframes ping { from { transform: scale(.4); opacity: .8; } to { transform: scale(1.6); opacity: 0; } }
.ch-lab { position: absolute; font: 400 9px/1 var(--f-data); letter-spacing: .08em; color: var(--dim); white-space: nowrap; }
.ch-lab--rule { color: var(--brass); right: 0; transform: translateY(-120%); }
.ch-lab--reg { color: var(--alert); right: 0; transform: translateY(-120%); }
.beams { display: grid; gap: 11px; padding-top: 2px; }
.beam-row { display: grid; grid-template-columns: minmax(70px, 34%) minmax(0, 1fr); gap: 10px; align-items: center; font: 400 10px/1.2 var(--f-data); color: var(--star-2); }
.beam-track { position: relative; height: 16px; display: flex; align-items: center; }
.beam { height: 2px; background: linear-gradient(90deg, transparent, var(--c)); box-shadow: 0 0 10px var(--c); transition: width .8s cubic-bezier(.2, .8, .2, 1); position: relative; }
.beam::after { content: ""; position: absolute; right: -3px; top: -2px; width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px 2px var(--c); }
.beam-mark { position: absolute; top: 1px; bottom: 1px; width: 1px; background: var(--star-2); opacity: .5; transition: left .8s cubic-bezier(.2, .8, .2, 1); }
.beam-val { position: absolute; right: 0; top: -11px; color: var(--star); }
.funnel { display: grid; gap: 5px; }
.funnel-step { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 10px; align-items: center; font: 400 10px/1 var(--f-data); color: var(--star-2); }
.funnel-bar { height: 18px; margin: 0 auto; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--c) 55%, transparent), transparent); border-left: 1px solid var(--c); border-right: 1px solid var(--c); transition: width .8s cubic-bezier(.2, .8, .2, 1); }
.funnel-step b { font-weight: 400; color: var(--star); }

/* ── A · Instrumente ── */
.loupe { border: 1px solid var(--hair); background: var(--panel); padding: 14px 16px 12px; margin-bottom: 18px; position: relative; display: grid; gap: 10px; }
.loupe-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.crumbs { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font: 400 11px/1 var(--f-data); letter-spacing: .1em; text-transform: uppercase; }
.crumbs button { border: 0; background: none; padding: 4px 2px; color: var(--star-2); }
.crumbs button:hover { color: var(--brass); }
.crumbs button[aria-current="true"] { color: var(--star); }
.crumbs i { color: var(--dim); font-style: normal; }
.seg { display: inline-flex; border: 1px solid var(--hair-2); }
.seg button { border: 0; background: none; padding: 6px 11px; font: 400 10px/1 var(--f-data); letter-spacing: .12em; text-transform: uppercase; color: var(--star-2); }
.seg button + button { border-left: 1px solid var(--hair-2); }
.seg button[aria-pressed="true"] { background: var(--brass-soft); color: var(--star); }
.lrow { display: grid; gap: 4px; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); animation: unfold .45s cubic-bezier(.2, .8, .2, 1); }
@keyframes unfold { from { opacity: 0; transform: translateY(-6px); clip-path: inset(0 0 100% 0); } }
.lcell { border: 1px solid var(--hair); background: rgba(255, 255, 255, .015); padding: 8px 8px 7px; text-align: left; display: grid; gap: 6px; min-width: 0; transition: border-color .25s, background .25s; }
.lcell:hover { border-color: var(--hair-2); }
.lcell[aria-pressed="true"] { border-color: var(--brass); background: var(--brass-soft); }
.lcell[disabled] { opacity: .3; cursor: default; }
.lcell .t { font: 400 11px/1 var(--f-data); letter-spacing: .06em; color: var(--star); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lcell .burn { display: flex; gap: 2px; height: 4px; }
.lcell .burn i { width: 4px; height: 4px; border-radius: 50%; background: var(--alert); box-shadow: 0 0 5px var(--alert); }
.lcell .burn i.w { background: var(--watch); box-shadow: 0 0 5px var(--watch); }
.lcell .burn i.g { background: var(--good); box-shadow: none; }
.lrow--years .lcell .t { font-size: 13px; }
.a-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.btn { border: 1px solid var(--hair-2); background: none; padding: 8px 12px; font: 500 10.5px/1 var(--f-data); letter-spacing: .14em; text-transform: uppercase; color: var(--star-2); }
.btn:hover { color: var(--star); border-color: var(--star-2); }
.btn--brass { color: var(--brass); border-color: color-mix(in srgb, var(--brass) 45%, transparent); }
.btn--brass:hover { background: var(--brass-soft); color: var(--star); }
.btn[aria-pressed="true"] { background: var(--brass-soft); color: var(--star); border-color: var(--brass); }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; grid-auto-flow: dense; align-items: start; }
.grid > .size-S { grid-column: span 3; } .grid > .size-M { grid-column: span 4; } .grid > .size-L { grid-column: span 6; }

/* ── B · Zeitstrom ── */
.b-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.b-tools .spacer { flex: 1; }
.stream { --side: 236px; border: 1px solid var(--hair); background: var(--panel); position: relative; user-select: none; }
.b-row { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); }
.b-axis { height: 46px; border-bottom: 1px solid var(--hair); position: relative; overflow: hidden; z-index: 2; }
.b-axis .tk { position: absolute; bottom: 0; width: 1px; background: var(--hair-2); }
.b-axis .tl { position: absolute; bottom: 12px; transform: translateX(4px); font: 400 10px/1 var(--f-data); letter-spacing: .08em; color: var(--star-2); white-space: nowrap; }
.b-axis .tl--major { color: var(--star); font-size: 11px; bottom: 26px; }
.b-axis .ev { position: absolute; top: 6px; width: 7px; height: 7px; border: 1px solid var(--brass); background: var(--night); transform: translateX(-50%) rotate(45deg); cursor: pointer; padding: 0; }
.b-axis .ev:hover { background: var(--brass); }
.b-side { padding: 0 14px; border-right: 1px solid var(--hair); display: flex; align-items: center; gap: 10px; min-width: 0; }
.b-group { grid-column: 1 / -1; padding: 12px 14px 6px; border-bottom: 1px solid var(--hair); font: 400 10px/1 var(--f-data); letter-spacing: .2em; text-transform: uppercase; color: var(--brass); background: rgba(255, 255, 255, .012); }
.lane { border-bottom: 1px solid var(--hair); transition: background .3s; }
.lane:hover { background: rgba(255, 255, 255, .015); }
.lane.is-dragging { opacity: .35; }
.lane .b-side { cursor: grab; }
.lane-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--star-2); opacity: .6; flex: none; }
.lane-dot[data-level="alert"] { background: var(--alert); opacity: 1; box-shadow: 0 0 10px var(--alert); }
.lane-dot[data-level="watch"] { background: var(--watch); opacity: 1; box-shadow: 0 0 8px var(--watch); }
.lane-dot[data-level="good"] { background: var(--good); opacity: 1; }
.lane-txt { flex: 1; min-width: 0; }
.lane-name { font: 600 17px/1.1 var(--f-voice); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lane-val { font: 400 12px/1.4 var(--f-data); color: var(--star-2); }
.lane-val b { font-weight: 400; color: var(--star); font-size: 14px; }
.lane-x { border: 0; background: none; color: var(--dim); font-size: 16px; opacity: 0; padding: 2px 4px; }
.lane:hover .lane-x, .lane:focus-within .lane-x { opacity: 1; }
.lane-track { position: relative; height: 72px; overflow: hidden; }
.lane--tall .lane-track { height: 120px; }
.lane-track svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.b-cursor { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--star); opacity: .45; pointer-events: none; }
.b-pin { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--brass) 9%, transparent); border-right: 1px solid var(--brass); box-shadow: 6px 0 16px -8px var(--brass); pointer-events: none; }
.lane.is-new { background: var(--brass-soft); }
.b-now { position: absolute; top: 0; bottom: 0; right: 0; pointer-events: none; background: repeating-linear-gradient(135deg, transparent 0 6px, rgba(255, 255, 255, .025) 6px 7px); }
.b-cursor-lab { position: absolute; top: 52px; transform: translateX(-50%); font: 400 10px/1 var(--f-data); background: var(--star); color: var(--night); padding: 3px 6px; pointer-events: none; white-space: nowrap; }
.b-overlay { position: absolute; top: 0; bottom: 0; right: 0; left: var(--side); z-index: 1; cursor: crosshair; touch-action: none; }
.b-hint { margin: 10px 0 0; font: 400 10px/1.4 var(--f-data); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }

/* ── C · Sternbilder ── */
.c-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); gap: 22px; align-items: start; }
.c-stage { position: sticky; top: 140px; aspect-ratio: 1; max-height: calc(100vh - 170px); max-width: 100%; margin: 0 auto; width: 100%; }
.c-stage svg { width: 100%; height: 100%; display: block; overflow: visible; }
.c-dock { display: grid; gap: 14px; }
.c-dock-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.c-dock-head h2 { margin: 0; font: italic 500 24px/1.1 var(--f-voice); }
.c-empty { border: 1px dashed var(--hair-2); padding: 18px; font: italic 500 17px/1.35 var(--f-voice); color: var(--star-2); }
.arc { cursor: pointer; transition: opacity .3s; }
.arc:hover { opacity: .85; }
.star-g { cursor: pointer; }
.star-g .halo { transition: r .9s cubic-bezier(.2, .8, .2, 1), opacity .9s; }
.star-g .prog { transition: stroke-dasharray .9s cubic-bezier(.2, .8, .2, 1), stroke .6s; }
.star-g:hover .lab-n { fill: var(--star); }
.parallax { transition: transform .6s cubic-bezier(.2, .8, .2, 1); }

/* ── Drawer, toast ── */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(2, 3, 8, .55); animation: fade .2s; }
