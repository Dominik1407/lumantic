name: CI

# Every push and pull request: vet and test on Linux and Windows, once with
# DuckDB built in (cgo, as the downloads and the image are built) and once
# without a C compiler, where DuckDB runs as the CLI (as for contributors
# without gcc).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        cgo: ["1", "0"]
    name: test (${{ matrix.os }}, ${{ matrix.cgo == '1' && 'DuckDB built in' || 'DuckDB CLI' }})
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build interface
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # DuckDB's prebuilt library for Windows links with the MinGW gcc the
      # Windows runners bring (as duckdb-go tests it); the gcc 16 of MSYS2 lacks
      # the thread-local symbols the library was built with.
      - name: C compiler
        if: matrix.cgo == '1'
        run: gcc --version

      # Without cgo the DuckDB tests run the CLI, the same version as the one built in.
      - name: DuckDB CLI
        if: matrix.cgo == '0'
        shell: bash
        run: |
          v=$(go list -m -f '{{.Version}}' github.com/duckdb/duckdb-go-bindings); n=${v#v0.}; n=${n%%.*}
          duckdb="v${n:0:1}.$((10#${n:1:2})).$((10#${n:3:2}))"
          case "$RUNNER_OS" in Windows) zip=duckdb_cli-windows-amd64.zip ;; *) zip=duckdb_cli-linux-amd64.zip ;; esac
          mkdir -p "$RUNNER_TEMP/duckdb"
          curl -fsSL -o "$RUNNER_TEMP/duckdb.zip" "https://github.com/duckdb/duckdb/releases/download/$duckdb/$zip"
          unzip -q "$RUNNER_TEMP/duckdb.zip" -d "$RUNNER_TEMP/duckdb"
          echo "LUMANTIC_DUCKDB=$(ls "$RUNNER_TEMP"/duckdb/duckdb*)" >> "$GITHUB_ENV"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
